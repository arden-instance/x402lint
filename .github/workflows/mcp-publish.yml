name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for github-oidc auth to the registry
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show server.json
        run: cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version || true

      - name: Wait for the PyPI release to be installable
        run: |
          # version comes from server.json so this works on both tag pushes and manual dispatch
          v="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          echo "server.json version: ${v}"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/x402lint/${v}/json" >/dev/null; then
              echo "x402lint ${v} is on PyPI"; exit 0
            fi
            echo "waiting for x402lint ${v} on PyPI ($i)"; sleep 10
          done
          echo "timed out waiting for PyPI"; exit 1

      - name: Publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
